name: Site

on:
  push:
    branches: [main]
  pull_request:

# Several commits can land in a few minutes when a batch of reports is written,
# and each one validates the whole tree. Only the newest is informative: an older
# run either agrees with it or is about content that has already been replaced.
# Superseding them keeps the queue short, which matters when runner capacity is
# degraded — on 6 August 2026 a run sat fifteen minutes without being acquired
# while three of its predecessors were still holding slots.
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pin the pandoc version used for local builds so the drift check below
      # compares like with like.
      - name: Install pandoc 3.10
        run: |
          curl -sSLo /tmp/pandoc.deb https://github.com/jgm/pandoc/releases/download/3.10/pandoc-3.10-1-amd64.deb
          sudo dpkg -i /tmp/pandoc.deb
          pandoc --version | head -n 1

      - name: Build site
        run: npm run build

      - name: Validate site
        run: npm test

      - name: Verify committed docs/ matches a fresh build
        run: |
          if [[ -n "$(git status --porcelain -- docs)" ]]; then
            echo "docs/ is out of sync with content/. Run 'npm run build' and commit the result." >&2
            git status --porcelain -- docs >&2
            exit 1
          fi
