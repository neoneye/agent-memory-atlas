<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Redirecting to Discord — Agent Memory Atlas</title>
    <!-- A stable atlas-owned URL in front of the invite, so the invite code can
         be rotated in one place instead of everywhere it has been pasted.
         Deliberately not sharing the analytics/consent head the other two pages
         carry: nobody reads this page, and it should not set a cookie or wait on
         a consent decision on the way through. -->
    <link rel="canonical" href="https://discord.gg/6JjmzzuVHj">
    <meta name="robots" content="noindex">
    <meta http-equiv="refresh" content="0; url=https://discord.gg/6JjmzzuVHj">
    <script>location.replace("https://discord.gg/6JjmzzuVHj")</script>
    <style>
      body {
        margin: 0;
        display: grid;
        place-items: center;
        min-height: 100vh;
        padding: 24px;
        color: #101b2a;
        background: #f7f4ec;
        font: 16px/1.65 "Manrope", Arial, sans-serif;
        text-align: center;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 1.4rem;
      }
      a {
        color: inherit;
        text-underline-offset: 3px;
      }
      p {
        margin: 0;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Redirecting to Discord&hellip;</h1>
      <p><a href="https://discord.gg/6JjmzzuVHj">Open the invite</a> if you are not redirected.</p>
    </main>
  </body>
</html>
